name: Build and deploy ASP.Net Core app to Azure Web App - shikochatbox

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Tvingar den att använda stabila .NET 8

      - name: Build with dotnet
        run: dotnet build "ChatService.Api/ChatService.Api.csproj" --configuration Release

      - name: dotnet publish
        # Här har jag lagt till citattecken och förenklat mappen till 'publish'
        run: dotnet publish "ChatService.Api/ChatService.Api.csproj" -c Release -o "./publish"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: "./publish" # Pekar nu på den förenklade mappen

  deploy:
    runs-on: windows-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'shikochatbox'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_8A37848F31A547BCBFB761E004AA3E08 }}
